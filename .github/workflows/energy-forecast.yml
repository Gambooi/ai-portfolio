name: Energy forecast

# Daily after the day-ahead auction results are published (~12:45 Danish time).
# Fetches data, retrains + backtests, writes the forecast JSON and commits it, which redeploys the site.
on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: energy-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Fetch data
        run: python ml/fetch_data.py

      - name: Train and backtest
        working-directory: ml
        run: python train.py

      - name: Forecast
        working-directory: ml
        run: python forecast.py

      - name: Commit forecast
        run: |
          git config user.name "Gambooi"
          git config user.email "54905817+Gambooi@users.noreply.github.com"
          git add public/data/energy_forecast.json public/data/energy_backtest.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update energy forecast $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
