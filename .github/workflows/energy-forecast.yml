name: Energy forecast

# Daily after the day-ahead auction results are published (~12:45 Danish time).
# Fetches data, retrains + backtests, writes the forecast JSON and commits it, which redeploys the site.
on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: energy-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main  # latest main, not the commit the run was queued on

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      # Keep downloaded history between runs so each day only refreshes the last 2 weeks.
      # A cache miss (first run, or no run for 7 days) falls back to a full download.
      - name: Restore data cache
        uses: actions/cache@v5
        with:
          path: ml/data/*.parquet
          key: energy-data-${{ github.run_id }}
          restore-keys: energy-data-

      - name: Fetch data
        run: python ml/fetch_data.py --incremental

      - name: Train and backtest
        working-directory: ml
        run: python train.py

      - name: Forecast
        working-directory: ml
        run: python forecast.py

      # The JSON files are generated output: apply this run's files on top of the newest main,
      # so pushes made while the job ran (code or another forecast) never cause merge conflicts.
      - name: Commit forecast
        run: |
          git config user.name "Gambooi"
          git config user.email "54905817+Gambooi@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/out"
          cp public/data/energy_forecast.json public/data/energy_backtest.json "$RUNNER_TEMP/out/"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/out/"*.json public/data/
            git add public/data/energy_forecast.json public/data/energy_backtest.json
            if git diff --cached --quiet; then
              echo "No changes"
              exit 0
            fi
            git commit -m "Update energy forecast $(date -u +%Y-%m-%d)"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected, retrying"
            sleep 5
          done
          exit 1
